<p>Listado de Heroes</p>

<div *ngIf="heroeBorrado; else noBorrado">
  <h3>Héroe eliminado:<small> {{ heroeBorrado }} </small></h3>
</div>

<ng-template #noBorrado>
    <h3>No hay héroes eliminados</h3>
</ng-template>



<button (click)="borrarHeroe()">
    Borrar Heroe
</button>


<ul>
  <li *ngFor="let heroe of heroes; index as i">
    {{ i + 1 }} -
    {{ heroe }}
  </li>
</ul>
